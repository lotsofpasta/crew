<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exchange</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/base.css">
<style>
  .layout { display: grid; gap: 16px; grid-template-columns: 260px minmax(0, 1fr) 300px; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
  #chat { height: 60vh; overflow-y: auto; }
  #chat li .who { font-weight: 600; }
  #tape { height: 30vh; overflow-y: auto; font-family: var(--mono); font-size: 12px; }
  .agent { cursor: pointer; }
  .agent { border-radius: var(--radius-sm); padding-left: 6px !important; padding-right: 6px; }
  .agent:hover { background: var(--panel-2); }
  .agent.sel { background: var(--accent-soft); }
  #chat li .who { color: var(--text); }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" data-brand-link><span data-brand>Exchange</span></a>
  <nav><a href="/">Dashboard</a><a href="/exchange" class="on">Exchange</a><a href="/visualizer">Visualizer</a></nav>
  <span id="role" class="tag"></span>
</header>
<main class="layout">
  <!-- The team and the lines -->
  <section class="card">
    <h2>Stations</h2>
    <ul id="agents" class="list"></ul>
    <h2 style="margin-top:14px">Lines</h2>
    <ul id="lines" class="list small"></ul>
  </section>

  <!-- Chat: every message someone wrote to someone -->
  <section class="card">
    <div class="row" style="justify-content:space-between"><h2>Chat <span id="filter" class="tag hidden"></span></h2>
      <button id="older" class="small">Older</button></div>
    <ul id="chat" class="list"></ul>
    <form id="say" class="owner-only row" style="margin-top:10px">
      <select id="say-to" style="width:auto"></select>
      <input id="say-text" placeholder="Message an agent…" style="flex:1">
      <button class="primary">Send</button>
    </form>
  </section>

  <!-- Drops, approvals and the activity tape -->
  <section class="card">
    <h2>Drop box</h2>
    <form id="drop" class="owner-only">
      <textarea id="drop-text" placeholder="A link or a note for the team. Start with @agent to pick who gets it."></textarea>
      <button class="primary" style="margin-top:6px">Drop</button> <span id="drop-msg" class="small muted"></span>
    </form>
    <ul id="queue" class="list small"></ul>
    <h2 style="margin-top:14px">Approvals</h2>
    <ul id="approvals" class="list small"></ul>
    <h2 style="margin-top:14px">Tape</h2>
    <ul id="tape" class="list"></ul>
  </section>
</main>

<script src="/static/app.js"></script>
<script>
const { api, esc, ago, time } = Crew;
let ROLE = "viewer", LAST = 0, OLDEST = 0, SRC = "", agents = [], lines = [];
const nameOf = (k) => (agents.find((a) => a.key === k) || lines.find((l) => l.key === k) || { name: k }).name || (lines.find((l) => l.key === k) || {}).label || k;

async function boot() {
  const who = await Crew.requireLogin();
  ROLE = who.role;
  document.title = who.brand + " · Exchange";
  Crew.brand(who.brand);
  document.getElementById("role").textContent = ROLE === "owner" ? "owner" : "view only";
  document.querySelectorAll(".owner-only").forEach((e) => e.classList.toggle("hidden", ROLE !== "owner"));
  Crew.poll(tick, 4000);
}

function chip(k) {
  const a = agents.find((x) => x.key === k);
  return a ? `<span class="dot" style="background:${Crew.agentColor(a)};margin-right:4px"></span>` : "";
}

function chatLine(s) {
  return `<li data-id="${s.id}"><span class="small muted">${time(s.t)}</span>
    ${chip(s.src)}<span class="who">${esc(nameOf(s.src))}</span> → ${esc(nameOf(s.dst))} <span class="tag">${esc(s.kind)}</span>
    <div class="${s.level ? "lvl-" + esc(s.level) : ""}">${Crew.mdInline(s.label)}</div>${s.text ? Crew.md(s.text) : ""}</li>`;
}

async function tick() {
  const d = await api(`/api/exchange?after=${LAST}&limit=300`);
  agents = d.agents; lines = d.lines;
  document.getElementById("agents").innerHTML = agents.map((a) =>
    `<li class="agent row ${SRC === a.key ? "sel" : ""}" data-src="${esc(a.key)}" style="flex-wrap:nowrap;align-items:flex-start" tabindex="0">${Crew.avatar(a)}
     <div style="min-width:0"><b>${esc(a.name)}</b><div class="small muted">${esc(a.role)} · ${a.alive ? "online" : "offline"} · ${ago(a.heartbeat)}</div>
     <div class="small muted">${esc(a.doing || "")}</div></div></li>`).join("");
  document.getElementById("lines").innerHTML = lines.map((l) => `<li>${esc(l.label)}</li>`).join("");
  const sel = document.getElementById("say-to");
  if (!sel.options.length) sel.innerHTML = agents.map((a) => `<option value="${esc(a.key)}">${esc(a.name)}</option>`).join("");

  const chat = document.getElementById("chat"), tape = document.getElementById("tape");
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
  for (const s of d.signals) {
    if (s.chat && (!SRC || s.src === SRC)) { chat.insertAdjacentHTML("beforeend", chatLine(s)); if (!OLDEST) OLDEST = s.id; }
    tape.insertAdjacentHTML("afterbegin", `<li>${time(s.t)} ${esc(s.src)} → ${esc(s.dst)} ${esc(s.kind)} ${esc(s.label)}</li>`);
  }
  while (tape.children.length > 200) tape.lastChild.remove();
  if (d.signals.length) LAST = d.signals[d.signals.length - 1].id;
  if (atBottom) chat.scrollTop = chat.scrollHeight;

  const [ag, q] = await Promise.all([api("/api/agents"), api("/api/exchange/queue")]);
  document.getElementById("approvals").innerHTML = ag.approvals.map((r) =>
    `<li><b>${esc(nameOf(r.agent))}</b>: ${esc(r.title)}${ROLE === "owner" ? `<div class="row" style="margin-top:4px">
      <button class="primary" data-act="approve" data-id="${r.id}">${esc((r.action || {}).label || "Approve")}</button>
      <button data-act="reject" data-id="${r.id}">Reject</button></div>` : ""}</li>`).join("") || `<li class="muted">Nothing waiting.</li>`;
  document.getElementById("queue").innerHTML = q.queue.map((x) =>
    `<li>${esc(x.text)}${ROLE === "owner" ? ` <button class="small" data-q="now" data-id="${x.id}">Send now</button>
     <button class="small" data-q="remove" data-id="${x.id}">Remove</button>` : ""}</li>`).join("")
    || `<li class="muted">Queue empty.</li>`;
}

async function older() {
  const rows = await api(`/api/exchange/chat?limit=60${OLDEST ? "&before=" + OLDEST : ""}${SRC ? "&src=" + SRC : ""}`);
  if (!rows.length) return;
  OLDEST = rows[0].id;
  document.getElementById("chat").insertAdjacentHTML("afterbegin", rows.map(chatLine).join(""));
}
document.getElementById("older").onclick = older;

// click a station: only that agent's messages (click again for everyone)
document.getElementById("agents").addEventListener("click", async (ev) => {
  const li = ev.target.closest("[data-src]");
  if (!li) return;
  SRC = SRC === li.dataset.src ? "" : li.dataset.src;
  const f = document.getElementById("filter");
  f.textContent = SRC ? nameOf(SRC) + " ✕" : ""; f.classList.toggle("hidden", !SRC);
  document.getElementById("chat").innerHTML = ""; OLDEST = 0;
  await older();
  const c = document.getElementById("chat"); c.scrollTop = c.scrollHeight;
});
document.getElementById("agents").addEventListener("keydown", (ev) => { if (ev.key === "Enter") ev.target.closest("[data-src]")?.click(); });
document.getElementById("filter").onclick = () => document.querySelector(`[data-src="${SRC}"]`)?.click();

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-act],[data-q]");
  if (!b) return;
  b.disabled = true;
  try {
    if (b.dataset.act) await api(`/api/agents/reports/${b.dataset.id}/${b.dataset.act}`, { method: "POST", body: {} });
    else await api(`/api/exchange/queue/${b.dataset.id}`, { method: "POST", body: { act: b.dataset.q } });
    tick();
  } catch (e) { alert(e.message); b.disabled = false; }
});

document.getElementById("say").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const t = document.getElementById("say-text");
  try { await api("/api/exchange/say", { method: "POST", body: { to: document.getElementById("say-to").value, text: t.value } }); t.value = ""; tick(); }
  catch (e) { alert(e.message); }
});
document.getElementById("drop").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById("drop-msg");
  try { await api("/api/exchange/drop", { method: "POST", body: { text: document.getElementById("drop-text").value } });
        ev.target.reset(); msg.textContent = "Queued."; tick(); }
  catch (e) { msg.textContent = e.message; }
});

boot();
</script>
</body>
</html>
